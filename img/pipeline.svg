<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f4f6f8;stroke:#8a96a3;stroke-width:1.2}
    .once{fill:#eef4ff;stroke:#5b7fc7}
    .apply{fill:#effaf1;stroke:#4f9a5d}
    .t{font-size:15px;font-weight:bold;fill:#1d2730}
    .s{font-size:11.5px;fill:#46525e}
    .l{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}
    .h{font-size:13px;fill:#46525e;font-style:italic}
  </style>

  <text x="20" y="28" class="h">einmal je Daten- oder Regeländerung</text>
  <text x="545" y="28" class="h">bei jedem apply</text>
  <line x1="532" y1="15" x2="532" y2="285" stroke="#c9d0d6" stroke-dasharray="4 4"/>

  <rect x="20" y="50" width="140" height="44" rx="6" class="box"/>
  <text x="90" y="70" text-anchor="middle" class="t">config.toml</text>
  <text x="90" y="86" text-anchor="middle" class="s">Einstellungen, [words]</text>

  <rect x="15" y="140" width="155" height="60" rx="6" class="box once"/>
  <text x="92" y="163" text-anchor="middle" class="t">source</text>
  <text x="92" y="180" text-anchor="middle" class="s">Entgendert-Wörterbuch</text>
  <text x="92" y="194" text-anchor="middle" class="s">Download + SHA-256</text>

  <rect x="195" y="140" width="140" height="60" rx="6" class="box once"/>
  <text x="265" y="163" text-anchor="middle" class="t">lexicon</text>
  <text x="265" y="180" text-anchor="middle" class="s">Personen, Endungen,</text>
  <text x="265" y="194" text-anchor="middle" class="s">eigene Wörter</text>

  <rect x="360" y="140" width="160" height="60" rx="6" class="box once"/>
  <text x="440" y="163" text-anchor="middle" class="t">rules</text>
  <text x="440" y="180" text-anchor="middle" class="s">Varianten, Minimierung,</text>
  <text x="440" y="194" text-anchor="middle" class="s">Tests → rules.tsv</text>

  <rect x="545" y="140" width="110" height="60" rx="6" class="box apply"/>
  <text x="600" y="163" text-anchor="middle" class="t">plan</text>
  <text x="600" y="180" text-anchor="middle" class="s">Edit-Skripte,</text>
  <text x="600" y="194" text-anchor="middle" class="s">Pässe</text>

  <rect x="670" y="140" width="130" height="60" rx="6" class="box apply"/>
  <text x="735" y="163" text-anchor="middle" class="t">font</text>
  <text x="735" y="180" text-anchor="middle" class="s">GSUB je Font,</text>
  <text x="735" y="194" text-anchor="middle" class="s">schreiben, prüfen</text>

  <rect x="830" y="140" width="115" height="60" rx="6" class="box apply"/>
  <text x="887" y="163" text-anchor="middle" class="t">system</text>
  <text x="887" y="180" text-anchor="middle" class="s">fontconfig,</text>
  <text x="887" y="194" text-anchor="middle" class="s">Manifest, fc-cache</text>

  <path d="M170,170 H191" class="l"/>
  <path d="M335,170 H356" class="l"/>
  <path d="M520,170 H541" class="l"/>
  <path d="M655,170 H666" class="l"/>
  <path d="M800,170 H826" class="l"/>
  <path d="M160,72 H265 V136" class="l"/>
  <path d="M265,72 H440 V136" class="l"/>

  <rect x="670" y="230" width="130" height="44" rx="6" class="box"/>
  <text x="735" y="250" text-anchor="middle" class="t">Systemfonts</text>
  <text x="735" y="266" text-anchor="middle" class="s">nur gelesen</text>
  <path d="M735,230 V204" class="l"/>

  <rect x="830" y="50" width="115" height="44" rx="6" class="box"/>
  <text x="887" y="70" text-anchor="middle" class="t">~/.local/…</text>
  <text x="887" y="86" text-anchor="middle" class="s">Kopien + Regel</text>
  <path d="M887,140 V98" class="l"/>
