<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .g{fill:#eef4ff;stroke:#5b7fc7;stroke-width:1.2}
    .d{fill:#fff7e8;stroke:#c99a3c;stroke-width:1.2}
    .x{fill:#effaf1;stroke:#4f9a5d;stroke-width:1.2}
    .t{font-size:15px;font-weight:bold;fill:#1d2730}
    .s{font-size:12px;fill:#46525e}
    .m{font-size:13px;fill:#1d2730;font-family:DejaVu Sans Mono, monospace}
    .l{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}
  </style>

  <text x="20" y="30" class="t">Text:</text>
  <g class="m">
    <rect x="80" y="12" width="300" height="28" rx="4" fill="#f4f6f8" stroke="#8a96a3"/>
    <text x="92" y="31">K o l l e g [*] i n n e n</text>
  </g>
  <text x="400" y="31" class="s">→ Anker „*“, letzter Stammbuchstabe „g“, danach Buchstabe</text>

  <rect x="20" y="70" width="280" height="110" rx="6" class="g"/>
  <text x="35" y="94" class="t">Gate (Marker-Pass)</text>
  <text x="35" y="114" class="s">in Feature calt, ganz vorne</text>
  <text x="35" y="134" class="m">a [*] L  → D_a</text>
  <text x="35" y="152" class="m">g [*] L  → D_g   ✓</text>
  <text x="35" y="170" class="m">L [*]    → D_fallback</text>

  <rect x="330" y="70" width="360" height="150" rx="6" class="d"/>
  <text x="345" y="94" class="t">Dispatch D_g</text>
  <text x="345" y="114" class="s">nur Regeln mit Stamm auf „g“, geordnet</text>
  <text x="345" y="136" class="m">Kolleg [*innen]   → Replace(en), Delete…  ✓</text>
  <text x="345" y="156" class="m">Kolleg [*in] L    → (Ausnahme)</text>
  <text x="345" y="176" class="m">Kolleg [*in]      → Replace(e), Delete…</text>
  <text x="345" y="196" class="m">…</text>
  <text x="345" y="212" class="m">L [*innen]        → Rückfall</text>

  <rect x="725" y="70" width="220" height="150" rx="6" class="x"/>
  <text x="740" y="94" class="t">Hilfs-Lookups</text>
  <text x="740" y="120" class="m">Delete     x → ∅</text>
  <text x="740" y="142" class="m">Deumlaut   ä → a …</text>
  <text x="740" y="164" class="m">Replace_1  * → e n</text>
  <text x="740" y="186" class="m">Replace_2  * → e</text>
  <text x="740" y="208" class="m">…</text>

  <path d="M300,152 H326" class="l"/>
  <path d="M690,136 H721" class="l"/>

  <text x="20" y="262" class="t">Ergebnis:</text>
  <g class="m">
    <rect x="110" y="244" width="300" height="28" rx="4" fill="#f4f6f8" stroke="#8a96a3"/>
    <text x="122" y="263">K o l l e g e n</text>
  </g>

  <text x="20" y="310" class="s">Davor läuft der Stamm-Pass: gleiches Schema, Gate nach Anker-Glyphe (z.B. „Ä“ in „Ärzt*in“ → „Arzt“).</text>
  <text x="20" y="330" class="s">Danach laufen die Lookups des Fonts (Ligaturen, Kerning) unverändert.</text>
  <text x="20" y="350" class="s">L = beliebiger Buchstabe · [ ] = Eingabe der Regel · rechts davon = Vorschau</text>
</svg>
