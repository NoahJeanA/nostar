[package]
name = "nostar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Patches system fonts so that German gender forms display as the generic masculine"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
harfrust = "0.15.0"
log = "0.4.34"
read-fonts = "0.46.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
write-fonts = "0.55.0"
