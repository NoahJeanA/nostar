[package]
name = "nostar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Shows German gender forms in the generic masculine by patching font copies"
license = "GPL-3.0-or-later"
repository = "https://github.com/NoahJeanA/nostar"
readme = "README.md"
keywords = ["fonts", "fontconfig", "opentype", "german", "gender"]
categories = ["command-line-utilities", "text-processing"]
# The program embeds tests/cases.tsv; test fonts and reference texts (own licenses) stay out.
include = ["/src/**", "/tests/cases.tsv", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
harfrust = "0.15.0"
log = "0.4.34"
read-fonts = "0.46.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
write-fonts = "0.55.0"

# Packages (TECHNIK.md 16). Man pages and completions come from `nostar --generate-man` and
# `nostar --generate <shell>` into target/assets before packaging.
[package.metadata.deb]
maintainer = "NoahJeanA <103172419+NoahJeanA@users.noreply.github.com>"
section = "utils"
depends = "$auto, fontconfig, curl"
recommends = "libglib2.0-bin"
extended-description = """\
nostar builds rules into copies of the system fonts (OpenType calt) so that German \
gender forms such as "Lehrer*innen" are drawn as "Lehrer". The text itself is not \
changed. Each user runs "nostar apply" in their own home directory; run \
"nostar remove" before uninstalling the package."""
assets = [
    ["target/release/nostar", "usr/bin/", "755"],
    ["target/assets/man/*", "usr/share/man/man1/", "644"],
    ["target/assets/nostar.bash", "usr/share/bash-completion/completions/nostar", "644"],
    ["target/assets/_nostar", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/nostar.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/nostar/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/nostar", dest = "/usr/bin/nostar", mode = "755" },
    { source = "target/assets/man/*", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "target/assets/nostar.bash", dest = "/usr/share/bash-completion/completions/nostar", mode = "644" },
    { source = "target/assets/_nostar", dest = "/usr/share/zsh/site-functions/_nostar", mode = "644" },
    { source = "target/assets/nostar.fish", dest = "/usr/share/fish/vendor_completions.d/nostar.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/nostar/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/nostar/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
curl = "*"

[package.metadata.generate-rpm.recommends]
glib2 = "*"
